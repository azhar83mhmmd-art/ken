<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0d0d0d">
  <title>Admin - AM Premify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="adm">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="1"/><path d="M22 6l-10 7L2 6"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  </defs>
</svg>

<!-- LOGIN -->
<section id="login" class="adm-login hidden">
  <form class="card" id="login-form" autocomplete="on">
    <div class="adm-brand">
      <span class="logo"><svg class="ic"><use href="#i-lock"/></svg></span>
      <div><b>Menu Admin</b><small>AM PREMIFY</small></div>
    </div>
    <div class="adm-note hidden" id="login-note"></div>
    <label class="field">
      <svg class="ic"><use href="#i-lock"/></svg>
      <input class="input" id="pw" type="password" name="password" autocomplete="current-password" placeholder="Kata sandi admin" required maxlength="200">
    </label>
    <p class="adm-err" id="login-err" role="alert"></p>
    <button class="btn btn-dark" id="login-btn" type="submit"><svg class="ic"><use href="#i-shield"/></svg><span>Masuk</span></button>
  </form>
</section>

<!-- APLIKASI -->
<div id="app" class="hidden">
  <header class="adm-top">
    <div class="adm-brand">
      <span class="logo"><svg class="ic"><use href="#i-bolt"/></svg></span>
      <div><b>Admin</b><small>AM PREMIFY</small></div>
    </div>
    <span class="grow"></span>
    <span class="adm-live wait" id="live"><i></i><b>MENYAMBUNG</b></span>
    <button class="adm-out" id="logout" type="button"><svg class="ic"><use href="#i-out"/></svg><span>Keluar</span></button>
  </header>

  <main class="adm-main">
    <div class="adm-stats">
      <div class="adm-stat" id="st-unread"><small>Chat baru</small><b>0</b></div>
      <div class="adm-stat"><small>Perangkat</small><b id="st-dev">0</b></div>
      <div class="adm-stat" id="st-blk"><small>Diblokir</small><b>0</b></div>
    </div>

    <nav class="adm-tabs" role="tablist">
      <button class="adm-tab on" role="tab" data-tab="usr" type="button"><svg class="ic"><use href="#i-users"/></svg>Pengguna</button>
      <button class="adm-tab" role="tab" data-tab="act" type="button"><svg class="ic"><use href="#i-ok"/></svg>Aktivasi</button>
      <button class="adm-tab" role="tab" data-tab="chat" type="button"><svg class="ic"><use href="#i-msg"/></svg>Chat<span class="abadge hidden" id="tab-badge">0</span></button>
      <button class="adm-tab" role="tab" data-tab="dev" type="button"><svg class="ic"><use href="#i-user"/></svg>Perangkat</button>
      <button class="adm-tab" role="tab" data-tab="com" type="button"><svg class="ic"><use href="#i-msg"/></svg>Komunitas</button>
    </nav>

    <section id="tab-usr">
      <div class="adm-bar usr-bar">
        <label class="field"><svg class="ic"><use href="#i-search"/></svg><input class="input" id="usr-q" type="search" placeholder="Cari nama, IP, atau email…" maxlength="40" autocomplete="off"></label>
        <div class="seg" id="usr-sort" role="group" aria-label="Urutkan">
          <button type="button" class="on" data-sort="acts">Terbanyak create</button>
          <button type="button" data-sort="recent">Terbaru aktif</button>
        </div>
        <label class="chk"><input type="checkbox" id="usr-only" checked><span>Hanya yang pernah create</span></label>
      </div>
      <div class="adm-list" id="usr-list" style="margin-top:12px"></div>
    </section>

    <section id="tab-act" class="hidden">
      <div class="adm-list" id="act-list"></div>
      <button class="ibtn more hidden" id="act-more" type="button"><svg class="ic"><use href="#i-down"/></svg>Muat lebih lama</button>
    </section>

    <section id="tab-chat" class="hidden">
      <div class="cx" id="cx">
        <div class="cx-list" id="th-list"></div>
        <div class="cx-conv" id="cv"></div>
      </div>
    </section>

    <section id="tab-dev" class="hidden">
      <div class="adm-bar">
        <label class="field"><svg class="ic"><use href="#i-search"/></svg><input class="input" id="dev-q" type="search" placeholder="Cari nama atau IP…" maxlength="40" autocomplete="off"></label>
      </div>
      <div class="adm-list" id="dev-list" style="margin-top:12px"></div>
    </section>

    <section id="tab-com" class="hidden">
      <div class="seg" id="com-sub" role="group" aria-label="Moderasi" style="margin-bottom:12px">
        <button type="button" class="on" data-sub="room">Room publik<span class="abadge" id="com-online" style="margin-left:6px">0</span></button>
        <button type="button" data-sub="rep">Balasan ulasan</button>
      </div>
      <div class="adm-list" id="com-list"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="/ui.js"></script>
<script src="/admin.js"></script>
</body>
</html>
